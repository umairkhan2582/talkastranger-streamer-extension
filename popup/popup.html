<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalkAStranger Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <div class="popup-header">
      <div class="brand">
        <img src="../icons/logo.svg" class="brand-logo" alt="TalkAStranger Logo" width="32" height="32">
        <div>
          <div class="brand-title">TalkAStranger</div>
          <div class="brand-sub">Streamer Companion</div>
        </div>
      </div>
      <div class="conn-dot" title="Live Ready"></div>
    </div>

    <div class="status-box">
      <div style="display:flex;align-items:center;gap:6px;">
        <img src="../icons/tassy.svg" alt="Tassy" width="22" height="22" style="flex-shrink:0;">
        <span class="status-label">Streamer</span>
      </div>
      <span class="status-name" id="popUsername">@creator</span>
    </div>

    <div class="action-list">
      <button class="action-btn primary" id="btnOpenSidepanel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        <span>Open Streamer HUD (Side Panel)</span>
      </button>

      <button class="action-btn" id="btnOpenCapture">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
        <span>Screen & Tab Studio</span>
      </button>

      <button class="action-btn" id="btnCopyOverlay">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span id="copyOverlayLabel">Copy OBS Overlay URL</span>
      </button>
    </div>

    <div class="footer-note">
      <a href="https://talkastranger.com" target="_blank">Open TalkAStranger.com</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
